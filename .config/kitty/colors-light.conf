# Light palette — warm paper, dark text. Mirrors colors-light for ghostty.
# Selected by ~/.config/hypr/scripts/set-wallpapers when the wallpaper mode is
# light (it repoints colors-active.conf here and sends kitty SIGUSR1 to reload).
# Pale green glass (kitty's tint; ghostty uses raspberry). Transparent so the
# wallpaper reads through, tint only where opaque.
background_opacity 0.5

background #dbe6d2
foreground #37322c

selection_background #e3d7c4
selection_foreground #37322c

cursor #ff2800
cursor_text_color #f4ece0

# ANSI — darkened so each hue reads against the warm-paper background.
color0  #3a342c
color1  #b23b2e
color2  #5a7d3c
color3  #a9741a
color4  #3b6ea5
color5  #8a4e9e
color6  #2f8a84
color7  #6d6456

color8  #5b5244
color9  #c75a46
color10 #6f9550
color11 #c08a2a
color12 #4f84bf
color13 #a267b5
color14 #3fa39c
color15 #37322c
