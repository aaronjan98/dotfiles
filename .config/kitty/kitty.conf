# =========================
# Core
# =========================

include keybindings.conf
include fonts.conf
# colors-active.conf is a symlink to colors-dark.conf / colors-light.conf,
# repointed by ~/.config/hypr/scripts/set-wallpapers on each wallpaper change
# (then kitty is sent SIGUSR1 to reload). Untracked — the two real palettes
# (colors-dark.conf, colors-light.conf) are what's committed.
include colors-active.conf

# Wayland first
linux_display_server wayland

# Allow tmux / nvim full control
enable_audio_bell no
allow_remote_control yes

# Reduce input latency
input_delay 1

# Window behavior (niri-friendly)
remember_window_size no
initial_window_width  100c
initial_window_height 30c

# Padding
window_padding_width 1 5 2 5

# =========================
# Cursor
# =========================

# background_opacity is set per-mode in colors-{dark,light}.conf (included above,
# before this point), so the light scheme can be more transparent than dark.
# dynamic_background_opacity must stay on for those per-mode values to apply live.
dynamic_background_opacity yes

cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# Red cursor
# cursor #ff3333
cursor #E62600
