# matugen: derive a Material You palette from the current wallpaper and render it
# for Quickshell.
#
# Invoked by ~/.config/hypr/scripts/set-wallpapers on every wallpaper change
# (Phase 1: always `--mode dark`). matugen writes ~/.cache/quickshell/colors.json;
# Quickshell's config/Appearance.qml watches that file and recolors the shell live
# with no reload. To extend the recolor beyond the shell later (kitty, GTK, …),
# add more [templates.*] blocks here — nothing else in the pipeline changes.

[config]

[templates.quickshell]
input_path = "/home/aj/.config/matugen/templates/quickshell-colors.json"
output_path = "/home/aj/.cache/quickshell/colors.json"

# Wallpaper-adaptive fuzzel colours. Rendered to the cache; the ~/.config/hypr/scripts/fz
# launcher passes each --flag line to fuzzel so the launcher matches the wallpaper (and
# flips light/dark) like the shell, instead of the static purple in fuzzel.ini.
[templates.fuzzel]
input_path = "/home/aj/.config/matugen/templates/fuzzel-colors"
output_path = "/home/aj/.cache/quickshell/fuzzel-colors"
