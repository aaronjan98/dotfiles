###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin

# Launcher (your choice: fuzzel)
$menu = ~/.config/hypr/scripts/fz

# Auto-start
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_RUNTIME_DIR
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_RUNTIME_DIR
exec-once = systemctl --user start xremap
exec-once = systemctl --user start cliphist-text cliphist-image
exec-once = nm-applet
exec-once = sh -lc 'd="${XDG_RUNTIME_DIR:-/tmp}/hypr-domain-last"; mkdir -p "$d"; : > "$d/last.txt"; : > "$d/visited.txt"'
exec-once = sh -lc 'sleep 0.5; pgrep -x qs >/dev/null || qs -p ~/.config/quickshell/rices/current/shell.qml'
exec-once = ~/.config/hypr/scripts/set-wallpapers
# watch-monitors is now a supervised systemd user service (nixos-config
# modules/hypr-monitor-watch.nix) — as an exec-once it silently died or never
# started, leaving monitor-hotplug handling dead for the session.
# exec-once = ~/.config/hypr/scripts/watch-monitors
# Launch Firefox on login so the orchestrator always has a live browser channel
# (the voice-assistant bridge extension connects on start; the 4am alarm plays
# into it). Session-restore is on (browser.startup.page=3) so tabs come back.
# Delayed so the WM/env (dbus, wayland) is up first. Single-instance, so a later
# `hypr-session restore` just reuses this window.
exec-once = sh -lc 'sleep 2; pgrep -f bin/firefox >/dev/null || firefox'
# exec-once = pkill -x hypridle; hypridle
#exec-once = ~/.config/hypr/scripts/hypr-pseudo-solo
