####################
### WINDOW RULES ###
####################

# Floating windows: default size + auto-center on Super+V toggle.
# Sourced after 20-binds.conf so these override the 1800×980 tiling sizes.
# Pinned windows (PiP) are excluded — they have intentional positions.
windowrulev2 = size 1100 700, floating:1, pinned:0
windowrulev2 = center,        floating:1, pinned:0

# btop scratchpad — sets pseudo-mode size for when Super+P is toggled
windowrulev2 = size 1703 884, class:^(btop)$

# Obsidian — compositor transparency + blur
# WM class has flip-flopped across Obsidian updates: "electron" (<=1.12.7), "obsidian" (>=1.13.7).
# Match both so a future revert doesn't silently break this again.
windowrulev2 = opacity 0.85 0.80, class:^(obsidian)$
windowrulev2 = opacity 0.85 0.80, class:^(electron)$, title:.*Obsidian.*

# Vesktop — compositor transparency + blur
windowrulev2 = opacity 0.85 0.80, class:^(vesktop)$

# RStudio — compositor transparency + blur, and pseudo-mode size for Super+P
windowrulev2 = opacity 0.85 0.80, class:^(rstudio)$
windowrulev2 = size 1800 980, class:^(rstudio)$

# Evince (PDF viewer) — compositor transparency + blur
windowrulev2 = opacity 0.75 0.70, class:^(org.gnome.Evince)$

# Nautilus (file manager) — compositor transparency + blur
windowrulev2 = opacity 0.75 0.70, class:^(org.gnome.Nautilus)$

# Firefox — compositor transparency + blur.
# Two values on purpose: alphaFullscreen defaults to 1.0 and is multiplied by
# decoration:fullscreen_opacity (also 1.0), so a fullscreened video already
# renders fully opaque without a third value. Inline and theater-mode video
# still take the window alpha — unavoidable, the rule is per-window.
windowrulev2 = opacity 0.90 0.85, class:^(firefox)$

# Keep Firefox opaque whenever the *client* thinks it is fullscreen. The normal
# fullscreen-opacity path keys on the internal mode (isEffectiveInternalFSMode),
# which Alt+Z deliberately leaves at 0 — so without this, a fake-fullscreened
# video would render at the 0.90 above. "*" matches any internal mode, so this
# covers both real fullscreen and Alt+Z.
windowrulev2 = opacity 1.0 1.0, class:^(firefox)$, fullscreenstate:* 2

# Emacs org-capture — float and center; title is "CAPTURE-<filename>"
windowrulev2 = float,        class:^(emacs)$, title:^(CAPTURE.*)$
windowrulev2 = size 900 500, class:^(emacs)$, title:^(CAPTURE.*)$
windowrulev2 = center,       class:^(emacs)$, title:^(CAPTURE.*)$

# Editors — compositor transparency + blur
windowrulev2 = opacity 0.75 0.70, class:^(cursor)$
windowrulev2 = opacity 0.70 0.65, class:^(codium)$
windowrulev2 = opacity 0.75 0.70, class:^(libreoffice.*)$

# Messaging — compositor transparency + blur
windowrulev2 = opacity 0.75 0.70, class:^(slack)$
windowrulev2 = opacity 0.75 0.70, class:^(element)$

# Utilities — compositor transparency + blur
windowrulev2 = opacity 0.70 0.65, class:^(org-jdownloader-update-launcher-JDLauncher)$
windowrulev2 = opacity 0.70 0.65, class:^(\.protonvpn-app-wrapped)$
windowrulev2 = opacity 0.70 0.65, class:^(com\.wolfram\.Wolfram\.14\.3)$
