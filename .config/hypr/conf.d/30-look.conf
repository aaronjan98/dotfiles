################
### MONITORS ###
################

# Laptop panel (Framework 13, 2256x1504 HiDPI, no Hyprland scaling — QS_UI_SCALE=1.75 compensates)
monitor = eDP-1, 2256x1504@60, 0x0, 1

# Samsung S34J55x ultrawide, positioned to the right of the laptop panel
monitor = DP-1, 3440x1440@50, 2256x0, 1.6

# Fallback for any other monitors
monitor = , preferred, auto, 1.5

# Pin DP-1's default/persistent workspace inside the external slot range (101-109,
# see hypr/scripts/ws-current-monitor.sh + quickshell TopBar.qml). Without this,
# Hyprland can hand DP-1 an off-scheme workspace ID on connect (observed: 100),
# which the top-bar dot island can't address or display — it silently strands
# whatever window opens there first.
workspace = 101, monitor:DP-1, default:true, persistent:true

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 6

    border_size = 2

    # Emerald Blue -> Sky Blue -> Amber Yellow -> Ferrari Red
    col.active_border = rgba(0061b4ff) rgba(7eb5f0ff) rgba(ffbf00ff) rgba(e62600ff) 25deg
    #col.active_border = rgba(0061b4ff) rgba(ffbf00ff) rgba(e62600ff) 35deg
    #col.active_border = rgba(7eb5f0ff) rgba(ff1493ff) rgba(e62600ff) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 7
    rounding_power = 3

    shadow {
        # Off: the dark drop shadow pooled as a gray smudge around the window's
        # rounded corners once the content frame goes transparent on light
        # wallpapers (it was camouflaged by the dimmed frame before). The Quickshell
        # glow rings already define the window edge, so no window shadow is needed.
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        # size/passes are overridden per-wallpaper by set-wallpapers (passes 2 for
        # a smooth dual-kawase frost); these are the post-hypr-reload baseline.
        size = 5
        passes = 2
        # brightness < 1 is REQUIRED: at the default 1.0 the blur over-brightens
        # translucent surfaces and ghostty's GPU surface in particular washes out
        # to near-white. 0.80 is the balance point — low enough that ghostty still
        # renders proper frosted glass (it's fine up to ~0.85), high enough that the
        # Quickshell panels (which also show this blurred backdrop) aren't too dark
        # on light wallpapers. The panels' own fill opacity (Appearance bubbleBg)
        # does the rest of the lift.
        brightness = 0.80

        vibrancy = 0.1696
    }
}

# Frosted-glass blur for the Quickshell shell panels (bars + popups), matched by the
# EXACT namespace "quickshell" (anchored regex). The content frame uses its own
# namespace "quickshell-frame" (see ContentFrame.qml) and is deliberately NOT matched
# here: it is a semi-transparent tint over a CRISP wallpaper (no blur), and the recess
# shadow would otherwise push its alpha past any ignorealpha threshold and get frosted.
# `ignorealpha X` only frosts surfaces with alpha ABOVE X, so the popups (~0.74) get the
# glass effect. These are layer rules for the quickshell shell only — they do not touch
# terminal windows (blurred via decoration:blur).
layerrule = blur, ^quickshell$
layerrule = ignorealpha 0.55, ^quickshell$

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    session_lock_xray = true
    force_default_wallpaper = 0
    disable_hyprland_logo = true

    # Let a relaunched hyprlock reclaim an existing session lock instead of
    # Hyprland showing the "lockscreen app died" fallback. If hyprlock ever gets
    # yeeten (e.g. a suspend races the lock), a new instance recovers cleanly.
    allow_session_lock_restore = true
}

cursor {
    no_warps = true
}
