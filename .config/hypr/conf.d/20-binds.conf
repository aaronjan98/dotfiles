#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# Keep the autogenerated gesture line (trackpad 3-finger horizontal workspace)
# gesture = 3, horizontal, workspace

# Example per-device config kept from autogenerated file (harmless if not present)
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Launch / session
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, G, exec, ghostty
bind = CTRL SHIFT, N, exec, neovide
bind = $mainMod SHIFT, Q, exit,

# Multi-machine sync — A=arrive (pull), E=end-of-session (push, then safe to lid-close)
# Both run via ~/.config/hypr/scripts/sync-toast for visible toast feedback,
# since closing the lid drops wifi mid-push.
bind = $mainMod, A, exec, ~/.config/hypr/scripts/sync-toast arrive
bind = $mainMod, E, exec, ~/.config/hypr/scripts/sync-toast leave

# Launcher (moved to Super+Space; keeps your muscle memory)
bind = $mainMod, Space, exec, $menu

# Window management
bind = $mainMod, W, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, V, centerwindow,     # auto-center immediately on float toggle
bind = $mainMod SHIFT, V, pin,
bind = $mainMod, C, centerwindow,  # re-center a dragged floating window
bind = $mainMod, X, exec, ocr-custom-split-sauron  # custom text+math OCR splitter (Sauron display backend)
bind = $mainMod, P, pseudo,        # dwindle
bind = CTRL SHIFT, T, togglesplit,   # dwindle
bind = $mainMod, F, fullscreen,         # true fullscreen (covers bars)
bind = $mainMod, Z, fullscreen, 1      # zoom: maximize to work area (stays within bars, others don't reflow)

# pseudo window sizing
# windowrulev2 = pseudo, class:^(firefox|kitty|obsidian|vesktop)$
windowrulev2 = size 1800 980, class:^(firefox|kitty|com\.mitchellh\.ghostty|vesktop|org-jdownloader-update-launcher-JDLauncher|codium|com\.wolfram\.Wolfram\.14\.3)$
windowrulev2 = size 1800 980, class:^(electron)$, title:.*Obsidian.*

# Move focus with mainMod + arrow keys. Horizontal focus first tries windows,
# then falls back to empty monitor focus when there is no window to move to.
bind = $mainMod, left,  exec, ~/.config/hypr/scripts/focus-window-or-screen l
bind = $mainMod, right, exec, ~/.config/hypr/scripts/focus-window-or-screen r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/ws-slot 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/ws-slot 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/ws-slot 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/ws-slot 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/ws-slot 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/ws-slot 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/ws-slot 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/ws-slot 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/ws-slot 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/ws-move-slot 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/ws-move-slot 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/ws-move-slot 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/ws-move-slot 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/ws-move-slot 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/ws-move-slot 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/ws-move-slot 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/ws-move-slot 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/ws-move-slot 9

# Move window (Super + Shift + hjkl)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Resize window (Super + Ctrl + hjkl)
bind = $mainMod, Backspace, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive,  40 0
bind = $mainMod CTRL, K, resizeactive,  0 -40
bind = $mainMod CTRL, J, resizeactive,  0  40

# Special workspace (scratchpad) (kept)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Workspace cycling with vim-style keys (H/L)
bind = $mainMod, H, exec, ~/.config/hypr/scripts/ws-rel -1
bind = $mainMod, L, exec, ~/.config/hypr/scripts/ws-rel +1
# Cycle through domains
bind = $mainMod, J, exec, ~/.config/hypr/scripts/ws-domain down
bind = $mainMod, K, exec, ~/.config/hypr/scripts/ws-domain up

# Navigate to an explicit domain
bind = $mainMod ALT, 1, exec, ~/.config/hypr/scripts/ws-domain set 1
bind = $mainMod ALT, 2, exec, ~/.config/hypr/scripts/ws-domain set 2
bind = $mainMod ALT, 3, exec, ~/.config/hypr/scripts/ws-domain set 3
bind = $mainMod ALT, 4, exec, ~/.config/hypr/scripts/ws-domain set 4
bind = $mainMod ALT, 5, exec, ~/.config/hypr/scripts/ws-domain set 5
bind = $mainMod ALT, 6, exec, ~/.config/hypr/scripts/ws-domain set 6
bind = $mainMod ALT, 7, exec, ~/.config/hypr/scripts/ws-domain set 7
bind = $mainMod ALT, 8, exec, ~/.config/hypr/scripts/ws-domain set 8
bind = $mainMod ALT, 9, exec, ~/.config/hypr/scripts/ws-domain set 9
# add more if/when you add domains

# Monitor focus (cycle between screens)
bind = $mainMod, period, focusmonitor, +1
bind = $mainMod, comma,  focusmonitor, -1
# Move active window to the next/prev monitor
bind = $mainMod SHIFT, period, movewindow, mon:+1
bind = $mainMod SHIFT, comma,  movewindow, mon:-1

# Scroll through existing workspaces with mainMod + scroll (kept)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + mouse dragging (kept)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media keys (requires playerctl) (kept)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

### Emacs ###
# Super+O  — org-agenda (calendar/task view; opens a new frame from the daemon)
# Super+Shift+O — org-capture (quick task/note entry; frame auto-closes on C-c C-c)
bind = $mainMod,       O, exec, emacsclient -c -e '(org-agenda-list)'
bind = $mainMod SHIFT, O, exec, emacsclient -c -e '(org-capture)'
# Super+Shift+E — open a general Emacs frame (Super+E is taken by sync-toast leave)
bind = $mainMod SHIFT, E, exec, emacsclient -c

### App specific binds ###
# Only when the active window is Firefox
bind = $mainMod ALT, J, sendshortcut, CTRL, Next,  active, class:^(firefox)$
bind = $mainMod ALT, K, sendshortcut, CTRL, Prior, active, class:^(firefox)$
# Kanata zoom bindings
bind = , code:191, exec, sh -lc 'wtype -M ctrl -k plus; wtype -m ctrl'
bind = , code:192, exec, sh -lc 'wtype -M ctrl -k minus; wtype -m ctrl'
bind = , code:193, exec, sh -lc 'wtype -M ctrl -k 0; wtype -m ctrl'
# Region screenshots
bind = ALT, C, exec, shot-region-save
# Menu for everything else (full screen etc):
bind = ALT SHIFT, C, exec, shot-menu
# OCR
bind = $mainMod, M, exec, math-ocr
bind = $mainMod, T, exec, text-ocr
bind = $mainMod, N, exec, ocr-combined
bind = $mainMod, B, exec, ocr-combined-sauron
# Notification panel
bind = $mainMod, backslash, exec, sh -lc 'qs ipc call notifs toggleCenter'
# wake display from sleep screen-off state
bind = $mainMod ALT, O, exec, hyprctl dispatch dpms on
bind = $mainMod ALT, L, exec, hyprlock

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
